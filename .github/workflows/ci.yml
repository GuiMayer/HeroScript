name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          # The contract diff needs the pre-push commit, including multi-commit pushes.
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      
      - name: Build
        run: dotnet build HeroScript.slnx --configuration Release
      
      - name: Core Tests
        run: dotnet test tests/Core.Tests/Core.Tests.csproj --no-build -c Release
      
      # Include untagged foundation/controller regressions as well as categorized tests.
      # Long deterministic journeys have their own session budget below.
      - name: API regressions and contract documentation
        timeout-minutes: 5
        env:
          HERESCRIPT_REPO_ROOT: ${{ github.workspace }}
        run: dotnet test tests/API.Tests/API.Tests.csproj --filter "FullyQualifiedName!~TenFreshRuntimesAgreeOnWholeJourneyReceiptsAndSemanticReplay&FullyQualifiedName!~WorldOneFoundationJourneyTests" --no-build -c Release

      - name: Contract change policy
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          changed_files="$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})"
          if [[ "$changed_files" == *"openapi/heroscript-v1.json"* && "$changed_files" != *"docs/api/changelog.md"* ]]; then
            echo "An OpenAPI change must include docs/api/changelog.md"
            exit 1
          fi
          git diff --check ${{ github.event.before }} ${{ github.sha }}
      
      - name: World one deterministic foundation journey
        timeout-minutes: 10
        env:
          HERESCRIPT_REPO_ROOT: ${{ github.workspace }}
        run: dotnet test tests/API.Tests/API.Tests.csproj --filter "FullyQualifiedName~WorldOneFoundationJourneyTests" --no-build -c Release -- RunConfiguration.TestSessionTimeout=600000

      - name: Volatile core deterministic journey
        timeout-minutes: 15
        env:
          HERESCRIPT_REPO_ROOT: ${{ github.workspace }}
        run: dotnet test tests/API.Tests/API.Tests.csproj --filter "FullyQualifiedName~TenFreshRuntimesAgreeOnWholeJourneyReceiptsAndSemanticReplay" --no-build -c Release -- RunConfiguration.TestSessionTimeout=600000
