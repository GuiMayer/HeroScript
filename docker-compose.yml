# HeroScript API - Docker Compose Configuration
version: '3.8'

services:
  heroscript-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heroscript
    ports:
      - "${API_PORT:-5260}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - HERESCRIPT_ADMIN_KEY=${HERESCRIPT_ADMIN_KEY:?HERESCRIPT_ADMIN_KEY is required}
      - AllowedOrigins__0=${ALLOWED_ORIGIN_0:-http://localhost:3000}
      - AllowedOrigins__1=${ALLOWED_ORIGIN_1:-http://localhost:5173}
      - Persistence__EventStorePath=/app/data/events
      - Persistence__RunStatePath=/app/data/runs
    volumes:
      # Persist event logs and run state
      - ./data/events:/app/data/events
      - ./data/runs:/app/data/runs
      # Mount configs for hot-reload (optional)
      - ./data/configs:/app/data/configs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - heroscript-network

networks:
  heroscript-network:
    driver: bridge
