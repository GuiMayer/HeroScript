name: Documentation Pages
on:
  push:
    branches: [codex/docs-site]
  pull_request:
    branches: [codex/docs-site]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Canonical main commit (empty selects current main)
        required: false
        type: string
      rollback:
        description: Explicitly publish an older canonical source revision
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: docs-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: portal
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: GuiMayer/HeroScript
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: portal/site/.nvmrc
          cache: npm
          cache-dependency-path: portal/site/package-lock.json
      - run: npm ci
        working-directory: portal/site
      - name: Resolve approved source
        id: source
        run: node scripts/resolve-source.mjs
        working-directory: portal/site
        env:
          DOCS_REPOSITORY: ${{ github.workspace }}/source
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      - name: Import and generate references
        run: npm run prepare:docs
        working-directory: portal/site
        env:
          DOCS_REPOSITORY: ${{ github.workspace }}/source
          DOCS_SOURCE_SHA: ${{ steps.source.outputs.sha }}
      - run: npm test && npm run typecheck && npm audit --audit-level=high
        working-directory: portal/site
        env:
          DOCS_REPOSITORY: ${{ github.workspace }}/source
          DOCS_SOURCE_SHA: ${{ steps.source.outputs.sha }}
      - run: npm run build && npm run validate && npm run smoke
        working-directory: portal/site
      - name: Build provenance
        run: node -e "const r=require('./generated/import-report.json');console.log('Source',r.sourceSha,'Site',r.siteSha,'Articles',r.documents.length)"
        working-directory: portal/site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: portal/site/build
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/docs-site'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reject superseded builds
        id: freshness
        run: node site/scripts/publication-guard.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          ROLLBACK: ${{ inputs.rollback }}
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
        if: steps.freshness.outputs.current == 'true'
