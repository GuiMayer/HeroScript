<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Herói — três variações de personalidade</title>
  <desc>Três heróis como peças monolíticas de xadrez, com silhuetas distintas. Andarilho, Regente e Fragmento. Sem membros ou articulações.</desc>
  <defs>
    <g id="wanderer">
      <!-- The hood and mantle are the silhouette of a single solid token. -->
      <path fill="#24241F" d="M61 89 110 29 163 58 178 121 152 142 164 201 184 241 168 259 173 281 190 294V310H30V294L47 281 52 259 36 241 62 189 78 142Z"/>
      <path fill="#F2EBDD" d="m110 58 35 21 10 37-30 14-37-12 8-33Z"/>
      <path fill="#24241F" d="m96 105 43-13-13 38-25-6Z"/>
      <path fill="#BC3D27" d="m71 137 80-14 8 27-54 20-25 54-11-38 20-26Z"/>
      <path fill="#F2EBDD" d="m140 170 4 57-12 14-4-30Z"/>
      <path fill="none" stroke="#F2EBDD" stroke-width="4" d="M59 280H161M44 293H176"/>
    </g>
    <g id="regent">
      <path fill="#24241F" d="m57 49 31 21 22-45 22 45 31-21-10 80-24 17 10 79 20 35 15 16V287L190 297V310H30V297L46 287V276L61 260 81 225 91 146 67 129Z"/>
      <path fill="#F2EBDD" d="M102 84H118V120H102Z"/>
      <path fill="#BC3D27" d="M70 128H150L141 147H79Z"/>
      <path fill="#BC3D27" d="m110 179 16 19-16 19-16-19Z"/>
      <path fill="none" stroke="#F2EBDD" stroke-width="4" d="M59 280H161M44 293H176"/>
    </g>
    <g id="shard">
      <path fill="#24241F" d="m64 70 72-46 28 40-12 70-15 18 9 74 20 36 12 16V288L194 298V310H26V298L42 288V278L54 262 74 226 85 158 69 140Z"/>
      <path fill="#F2EBDD" d="m130 43-12 48 16 16-30 48 9-51-16-14Z"/>
      <path fill="#BC3D27" d="m91 152 28-39 13 16-28 47 7 48-20-18Z"/>
      <path fill="none" stroke="#F2EBDD" stroke-width="4" d="M55 280H165M40 293H180"/>
    </g>
  </defs>
  <rect width="1440" height="900" fill="#F2EBDD"/>
  <g fill="#24241F" font-family="Consolas, 'Courier New', monospace">
    <text x="64" y="65" font-size="28" letter-spacing="2">UM HERÓI, NÃO APENAS UM PEÃO</text>
    <text x="64" y="98" font-size="14">VARIAÇÕES DE SILHUETA / MESMA LINGUAGEM DAS PEÇAS / SEM ARTICULAÇÕES</text>
  </g>
  <path d="M64 122H1376" stroke="#24241F"/>
  <use href="#wanderer" transform="translate(140 163) scale(1.25)"/>
  <use href="#regent" transform="translate(580 163) scale(1.25)"/>
  <use href="#shard" transform="translate(1020 163) scale(1.25)"/>
  <g fill="#24241F" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
    <g font-size="23">
      <text x="278" y="598">A / ANDARILHO</text>
      <text x="718" y="598">B / REGENTE</text>
      <text x="1158" y="598">C / FRAGMENTO</text>
    </g>
    <g font-size="14">
      <text x="278" y="631">Capuz assimétrico, faixa vermelha.</text>
      <text x="278" y="655">Mais aventureiro e reconhecível.</text>
      <text x="718" y="631">Coroa de três pontas, selo central.</text>
      <text x="718" y="655">Mais nobre, firme e estratégico.</text>
      <text x="1158" y="631">Topo fraturado, núcleo exposto.</text>
      <text x="1158" y="655">Mais abstrato e sobrenatural.</text>
    </g>
  </g>
  <path d="M64 696H1376" stroke="#24241F"/>
  <g>
    <use href="#wanderer" transform="translate(247 718) scale(.28)"/>
    <use href="#regent" transform="translate(687 718) scale(.28)"/>
    <use href="#shard" transform="translate(1127 718) scale(.28)"/>
  </g>
  <g fill="#24241F" font-family="Consolas, 'Courier New', monospace" font-size="13">
    <text x="64" y="846">FORMAS MONOLÍTICAS · BASE COMPARTILHADA · CORES CHAPADAS · NOMES APENAS PARA IDENTIFICAR OS CONCEITOS</text>
  </g>
</svg>
